<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEVAK — Your Intelligent Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d4ff;
            --secondary: #7c3aed;
            --accent: #ff6b9d;
            --bg: #0a0a1a;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-secondary: #b0b0c8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --orb-glow: rgba(0, 212, 255, 0.6);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --font-display: 'Orbitron', monospace;
            --font-body: 'Inter', sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: var(--font-body);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
        }
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            padding: 20px;
            gap: 12px;
        }
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 30px;
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 10;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-icon {
            font-size: 1.8rem;
            -webkit-text-fill-color: initial;
            animation: logoPulse 2s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            letter-spacing: 1px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: dotPulse 1.5s ease-in-out infinite;
        }
        .status-dot.idle { background: var(--primary); animation: dotPulse 2.5s ease-in-out infinite; }
        .status-dot.listening { background: var(--accent); animation: dotPulse 0.5s ease-in-out infinite; }
        .status-dot.speaking { background: var(--secondary); animation: dotPulse 0.8s ease-in-out infinite; }
        .status-dot.processing { background: var(--warning); animation: dotPulse 0.7s ease-in-out infinite; }
        .status-dot.error { background: var(--danger); animation: dotPulse 1s ease-in-out infinite; }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.5); }
        }
        .orb-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 70px;      /* increased to clear header */
        }
        .orb-container {
            position: relative;
            width: 120px;           /* slightly smaller orb */
            height: 120px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .orb-container:hover { transform: scale(1.05); }
        .orb-container:active { transform: scale(0.95); }
        .orb {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(0, 212, 255, 0.8), rgba(124, 58, 237, 0.6), rgba(255, 107, 157, 0.4));
            box-shadow: 0 0 60px var(--orb-glow), 0 0 120px rgba(124, 58, 237, 0.3), 0 0 200px rgba(255, 107, 157, 0.15), inset 0 0 40px rgba(255, 255, 255, 0.1);
            animation: orbFloat 4s ease-in-out infinite, orbColorShift 8s ease-in-out infinite;
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        .orb.listening {
            box-shadow: 0 0 100px rgba(255, 107, 157, 0.8), 0 0 200px rgba(255, 107, 157, 0.4), 0 0 300px rgba(255, 107, 157, 0.2), inset 0 0 60px rgba(255, 255, 255, 0.15);
            animation: orbFloat 4s ease-in-out infinite, orbListening 0.8s ease-in-out infinite;
        }
        .orb.speaking {
            box-shadow: 0 0 100px rgba(124, 58, 237, 0.8), 0 0 200px rgba(124, 58, 237, 0.4), 0 0 300px rgba(124, 58, 237, 0.2), inset 0 0 60px rgba(255, 255, 255, 0.15);
            animation: orbFloat 4s ease-in-out infinite, orbSpeaking 0.4s ease-in-out infinite;
        }
        .orb-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 212, 255, 0.3);
            animation: ringExpand 3s ease-out infinite;
            pointer-events: none;
        }
        .orb-ring:nth-child(2) { animation-delay: 1s; border-color: rgba(124, 58, 237, 0.3); }
        .orb-ring:nth-child(3) { animation-delay: 2s; border-color: rgba(255, 107, 157, 0.2); }
        @keyframes orbFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes orbColorShift { 0%, 100% { filter: hue-rotate(0deg); } 33% { filter: hue-rotate(20deg); } 66% { filter: hue-rotate(-15deg); } }
        @keyframes orbListening { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes orbSpeaking { 0%, 100% { transform: scale(1); border-radius: 50%; } 25% { transform: scale(1.06, 0.94); border-radius: 45%; } 50% { transform: scale(0.96, 1.06); border-radius: 55%; } 75% { transform: scale(1.04, 0.96); border-radius: 48%; } }
        @keyframes ringExpand { 0% { width: 100%; height: 100%; opacity: 0.8; } 100% { width: 250%; height: 250%; opacity: 0; } }
        .orb-emoji {
            font-size: 2.4rem;      /* slightly smaller emoji */
            animation: emojiFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
        }
        @keyframes emojiFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(5deg); } }
        .orb-label {
            font-family: var(--font-display);
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            text-align: center;
        }
        #waveformCanvas {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 30px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #waveformCanvas.active { opacity: 1; }
        .chat-panel {
            width: 100%;
            max-width: 750px;
            height: 360px;          /* slightly reduced to give orb more space */
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
        }
        .chat-clear {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s;
            padding: 4px;
        }
        .chat-clear:hover { color: var(--accent); }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 212, 255, 0.3) transparent;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.3); border-radius: 3px; }
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.6;
            animation: messageIn 0.4s ease-out forwards;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(0, 212, 255, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-bottom-right-radius: 4px;
            color: #e0f7ff;
        }
        .message.sevak {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.25), rgba(124, 58, 237, 0.1));
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-bottom-left-radius: 4px;
            color: #efe6ff;
        }
        .message .timestamp { font-size: 0.65rem; color: var(--text-secondary); margin-top: 4px; display: block; opacity: 0.7; }
        .message-image {
            margin-top: 10px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            max-width: 100%;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
        }
        .message-image:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 35px rgba(0, 212, 255, 0.3);
            transform: scale(1.01);
        }
        .message-image img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            max-height: 160px;       /* limit image height inside chat */
        }
        .image-caption {
            font-size: 0.7rem;
            color: var(--text-secondary);
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.4);
            text-align: center;
            font-style: italic;
        }
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .lightbox-overlay.active { opacity: 1; pointer-events: auto; }
        .lightbox-content {
            max-width: 90%;
            max-height: 85%;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.4);
        }
        .lightbox-content img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            max-height: 80vh;
        }
        .lightbox-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 2.2rem;
            color: white;
            cursor: pointer;
            z-index: 1001;
            transition: all 0.3s;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            line-height: 1;
        }
        .lightbox-close:hover { color: var(--accent); transform: scale(1.15); }
        .lightbox-caption {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 10px 20px;
            font-family: var(--font-body);
            letter-spacing: 0.5px;
        }
        @keyframes messageIn {
            0% { opacity: 0; transform: translateY(15px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            align-self: flex-start;
            background: rgba(124, 58, 237, 0.15);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            animation: messageIn 0.3s ease-out;
        }
        .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); animation: typingBounce 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }
        .input-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            width: 100%;
            max-width: 750px;
            background: var(--surface);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 0.95rem;
            font-family: var(--font-body);
            letter-spacing: 0.3px;
            padding: 8px 4px;
        }
        .input-area input::placeholder { color: var(--text-secondary); opacity: 0.6; }
        .mic-btn, .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .mic-btn { border: 2px solid var(--glass-border); background: var(--surface); color: var(--text); }
        .mic-btn:hover { border-color: var(--primary); background: rgba(0,212,255,0.15); box-shadow: 0 0 25px rgba(0,212,255,0.3); }
        .mic-btn.listening { border-color: var(--accent); background: rgba(255,107,157,0.2); box-shadow: 0 0 35px rgba(255,107,157,0.5); animation: micPulse 0.6s ease-in-out infinite; }
        @keyframes micPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .send-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 4px 20px rgba(0,212,255,0.4); }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 30px rgba(0,212,255,0.6); }
        .send-btn:active { transform: scale(0.95); }
        @media (max-width: 768px) {
            .orb-container { width: 90px; height: 90px; }
            .orb-emoji { font-size: 1.8rem; }
            .chat-panel { height: 240px; max-width: 95vw; }
            .input-area { max-width: 95vw; padding: 10px 14px; }
            .header { padding: 10px 16px; }
            .logo { font-size: 1.1rem; letter-spacing: 1px; }
            .message { font-size: 0.8rem; padding: 10px 14px; }
            .orb-area { margin-top: 50px; gap: 4px; }
            .main-container { gap: 8px; padding: 8px; }
            .chat-messages { padding: 15px 16px; }
        }
        @media (max-width: 400px) {
            .orb-container { width: 70px; height: 70px; }
            .orb-emoji { font-size: 1.4rem; }
            .chat-panel { height: 180px; }
            .mic-btn, .send-btn { width: 36px; height: 36px; font-size: 1rem; }
            .message { font-size: 0.75rem; }
            .orb-area { margin-top: 40px; }
        }
        .glitch-text {
            position: relative;
            animation: glitchSkew 6s infinite;
        }
        @keyframes glitchSkew {
            0%, 90%, 100% { transform: skew(0); }
            92% { transform: skew(2deg); }
            94% { transform: skew(-1deg); }
            96% { transform: skew(1deg); }
            98% { transform: skew(0); }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <!-- Lightbox Modal -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <span class="lightbox-close" id="lightboxClose">✕</span>
        <div class="lightbox-content" id="lightboxContent">
            <img id="lightboxImage" src="" alt="Full size image">
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="header">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <span class="glitch-text">SEVAK</span>
            </div>
            <div class="status-badge">
                <span class="status-dot idle" id="statusDot"></span>
                <span id="statusText">Ready to Serve</span>
            </div>
        </div>

        <div class="orb-area">
            <div class="orb-container" id="orbContainer" title="Click to speak, or use the mic button">
                <div class="orb-ring"></div>
                <div class="orb-ring"></div>
                <div class="orb-ring"></div>
                <div class="orb" id="orb">
                    <span class="orb-emoji" id="orbEmoji">🧠</span>
                </div>
            </div>
            <div class="orb-label" id="orbLabel">Tap to speak</div>
            <canvas id="waveformCanvas"></canvas>
        </div>

        <div class="chat-panel" id="chatPanel">
            <div class="chat-header">
                <span>💬 Conversation</span>
                <button class="chat-clear" id="clearChat" title="Clear chat">✕</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
        </div>

        <div class="input-area">
            <button class="mic-btn" id="micBtn" title="Voice input">🎤</button>
            <input type="text" id="textInput" placeholder="Type a command... e.g., 'open YouTube' or 'show me Einstein'" autocomplete="off">
            <button class="send-btn" id="sendBtn" title="Send">➤</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ── DOM Elements ──
            const orb = document.getElementById('orb');
            const orbContainer = document.getElementById('orbContainer');
            const orbEmoji = document.getElementById('orbEmoji');
            const orbLabel = document.getElementById('orbLabel');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const chatMessages = document.getElementById('chatMessages');
            const textInput = document.getElementById('textInput');
            const sendBtn = document.getElementById('sendBtn');
            const micBtn = document.getElementById('micBtn');
            const clearChatBtn = document.getElementById('clearChat');
            const waveformCanvas = document.getElementById('waveformCanvas');
            const particleCanvas = document.getElementById('particleCanvas');
            const lightboxOverlay = document.getElementById('lightboxOverlay');
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxCaption = document.getElementById('lightboxCaption');
            const lightboxClose = document.getElementById('lightboxClose');

            // ── State ──
            let isListening = false;
            let isSpeaking = false;
            let isProcessing = false;
            let recognition = null;
            let synthesis = window.speechSynthesis;
            let selectedVoice = null;
            let waveformCtx = null;
            let waveformAnimationId = null;
            let currentLightboxImage = '';

            // ── Personality Phrases ──
            const greetings = [
                "Hello Sir, Sevak at your service! How may I assist you today?",
                "Greetings, Sir! I'm awake and ready. What can I do for you?",
                "Good to see you, Sir! Sevak reporting for duty. What's your command?",
                "Ah, Sir! I was just thinking about you. What do you need?"
            ];
            const thanks = [
                "You're most welcome, Sir. Anything else?",
                "Always a pleasure to serve, Sir.",
                "It's my honor, Sir. Sevak is here 24/7 for you.",
                "No thanks needed, Sir. That's what I'm built for."
            ];
            const apologies = [
                "I apologize, Sir. I couldn't process that. Could you rephrase?",
                "My apologies, Sir. I didn't quite catch that. Could you try again?",
                "Sir, I'm sorry but I'm not sure what you mean. Could you be more specific?",
                "Pardon me, Sir. My circuits didn't compute that. Try again?"
            ];
            const helpText = `Sir, here are some things you can ask me:<br>
        • "Open YouTube" – opens YouTube<br>
        • "Play <i>song name</i> on YouTube" – searches YouTube<br>
        • "Search <i>anything</i> on Google" or "Google <i>anything</i>" – Google search<br>
        • "Temperature in Delhi" or "Weather of Mumbai" – current weather<br>
        • "Who is Albert Einstein?" – knowledge from Wikipedia <strong>(with image!)</strong><br>
        • "Show me the Eiffel Tower" – displays an image<br>
        • "What time is it?" – current time<br>
        • "What date is today?" – today's date<br>
        • "Tell me a joke" – I'll try to make you laugh<br>
        • "How are you?" – I'll ask you back<br>
        • "Who is your creator?" – about my maker<br>
        • "Flip a coin" – random heads/tails<br>
        • "Roll a dice" – random number<br>
        • "Give me a motivational quote" – inspiring words<br>
        • "Tell me a fact" – interesting fact<br>
        • "Open mysql" – I'll assist with app commands<br>
        • "Thank you" – I'll respond politely<br>
        • "Help" – show this list`;

            // ── Website Database ──
            const websiteDatabase = {
                youtube: { url: 'https://www.youtube.com', name: 'YouTube' },
                google: { url: 'https://www.google.com', name: 'Google' },
                gmail: { url: 'https://mail.google.com', name: 'Gmail' },
                facebook: { url: 'https://www.facebook.com', name: 'Facebook' },
                instagram: { url: 'https://www.instagram.com', name: 'Instagram' },
                twitter: { url: 'https://twitter.com', name: 'Twitter' },
                x: { url: 'https://x.com', name: 'X (Twitter)' },
                github: { url: 'https://github.com', name: 'GitHub' },
                stackoverflow: { url: 'https://stackoverflow.com', name: 'Stack Overflow' },
                reddit: { url: 'https://www.reddit.com', name: 'Reddit' },
                linkedin: { url: 'https://www.linkedin.com', name: 'LinkedIn' },
                amazon: { url: 'https://www.amazon.com', name: 'Amazon' },
                wikipedia: { url: 'https://www.wikipedia.org', name: 'Wikipedia' },
                netflix: { url: 'https://www.netflix.com', name: 'Netflix' },
                spotify: { url: 'https://open.spotify.com', name: 'Spotify' },
                whatsapp: { url: 'https://web.whatsapp.com', name: 'WhatsApp Web' },

            function initSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

                const rec = new SpeechRecognition();

                rec.lang = 'en-IN';
                rec.maxAlternatives = 3;
                rec.onstart = () => { isListening = true; updateUIState('listening'); showWaveform(); };
                rec.onresult = (event) => {
                    let finalTranscript = '';
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) finalTranscript += transcript;
                        else interimTranscript += transcript;
                    }
                    if (interimTranscript) { textInput.value = interimTranscript; textInput.placeholder = interimTranscript; }
                    if (finalTranscript) { textInput.value = finalTranscript; stopListening(); processCommand(finalTranscript); }
                };
                rec.onerror = (event) => {
                    if (event.error === 'not-allowed') addMessage('sevak', 'Sir, I need microphone access to hear you. Please enable it in your browser settings. 🙏');
                    else if (event.error !== 'aborted') addMessage('sevak', getRandomFrom(apologies));

            function showWaveform() {

                if (waveformAnimationId) cancelAnimationFrame(waveformAnimationId);

            function hideWaveform() { waveformCanvas.classList.remove('active'); if (waveformAnimationId) { cancelAnimationFrame(waveformAnimationId); waveformAnimationId = null; } if (waveformCtx) { waveformCtx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height); } }
            function animateWaveform() {
                if (!waveformCtx) return;
                const canvas = waveformCanvas, ctx = waveformCtx, w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);
                const bars = 40, barWidth = w / bars, now = Date.now() / 150;
                for (let i = 0; i < bars; i++) {
                    const height = Math.sin(now + i * 0.6) * 10 + Math.cos(now * 1.3 + i * 0.8) * 6 + 14;
                    const x = i * barWidth + 1, y = (h - height) / 2;
                    const grad = ctx.createLinearGradient(0, y, 0, y + height);
                    grad.addColorStop(0, '#ff6b9d'); grad.addColorStop(0.5, '#7c3aed'); grad.addColorStop(1, '#00d4ff');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.roundRect(x, y, barWidth - 2, height, 3);
                    ctx.fill();
                }
                waveformAnimationId = requestAnimationFrame(animateWaveform);
            }

            // ── Particle System ──
            const particles = [];
            const particleCount = 100;
            let particleCtx = null;
            function initParticles() {
                particleCtx = particleCanvas.getContext('2d');
                particleCanvas.width = window.innerWidth;
                particleCanvas.height = window.innerHeight;
                for (let i = 0; i < particleCount; i++) {
                    particles.push({ x: Math.random() * particleCanvas.width, y: Math.random() * particleCanvas.height, size: Math.random() * 3 + 1, speedX: (Math.random() - 0.5) * 0.4, speedY: (Math.random() - 0.5) * 0.4, opacity: Math.random() * 0.6 + 0.2, color: ['#00d4ff', '#7c3aed', '#ff6b9d', '#ffffff'][Math.floor(Math.random() * 4)] });
                }
                animateParticles();
            }
            function animateParticles() {
                if (!particleCtx) return;
                const ctx = particleCtx;
                ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
                particles.forEach(p => {
                    p.x += p.speedX; p.y += p.speedY;
                    if (p.x < 0) p.x = particleCanvas.width; if (p.x > particleCanvas.width) p.x = 0;
                    if (p.y < 0) p.y = particleCanvas.height; if (p.y > particleCanvas.height) p.y = 0;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color; ctx.globalAlpha = p.opacity;
                    ctx.fill(); ctx.globalAlpha = 1;
                });
                requestAnimationFrame(animateParticles);
            }

            // ── Wikipedia API with image support ──
            async function fetchWikipediaSummary(topic) {
                try {
                    const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(topic)}`);
                    if (!response.ok) return null;
                    const data = await response.json();
                    if (data.extract && data.extract.length > 0) {
                        return {
                            title: data.title,
                            extract: data.extract,
                            url: data.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${encodeURIComponent(topic)}`,
                            thumbnail: data.thumbnail?.source || null,
                            originalImage: data.originalimage?.source || null
                        };
                    }
                    return null;
                } catch (e) { return null; }
            }
            async function searchWikipedia(query) {
                try {
                    const response = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=5`);
                    if (!response.ok) return null;
                    const data = await response.json();
                    if (data.query && data.query.search && data.query.search.length > 0) {
                        const firstResult = data.query.search[0];
                        return fetchWikipediaSummary(firstResult.title);
                    }
                    return null;
                } catch (e) { return null; }
            }
            async function fetchWikimediaImage(query) {
                try {
                    const resp = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=400&format=json&origin=*`);
                    if (!resp.ok) return null;
                    const data = await resp.json();
                    if (data.query && data.query.pages) {
                        for (const pageId of Object.keys(data.query.pages)) {
                            const page = data.query.pages[pageId];
                            if (page.imageinfo && page.imageinfo[0] && page.imageinfo[0].thumburl) {
                                return { url: page.imageinfo[0].thumburl, title: page.title.replace('File:', '').replace(/\.(jpg|jpeg|png|gif|svg)/i, '') };
                            }
                        }
                    }
                    return null;
                } catch (e) { return null; }
            }

            // ── Weather API ──
            async function getWeather(city) {
                try {
                    const geoResp = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
                    const geoData = await geoResp.json();
                    if (!geoData.results || geoData.results.length === 0) return null;
                    const { latitude, longitude, name } = geoData.results[0];
                    const weatherResp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
                    const weatherData = await weatherResp.json();
                    const temp = weatherData.current_weather.temperature;
                    const windspeed = weatherData.current_weather.windspeed;
                    const conditionCode = weatherData.current_weather.weathercode;
                    let condition = 'Clear';
                    if (conditionCode <= 3) condition = 'Clear';
                    else if (conditionCode <= 48) condition = 'Foggy';
                    else if (conditionCode <= 67) condition = 'Rainy';
                    else if (conditionCode <= 77) condition = 'Snowy';
                    else if (conditionCode <= 82) condition = 'Showers';
                    else if (conditionCode <= 86) condition = 'Thunderstorm';
                    else condition = 'Unknown';
                    return { name, temp, windspeed, condition };
                } catch (e) { return null; }
            }

            // ── Command Processing ──
            async function processCommand(command) {
                const rawCommand = command.trim().toLowerCase();
                if (!rawCommand) return;
                addMessage('user', command.trim());
                textInput.value = '';
                isProcessing = true;
                updateUIState('processing');
                const typingIndicator = addTypingIndicator();
                await new Promise(resolve => setTimeout(resolve, 400 + Math.random() * 600));
                try {
                    const response = await handleCommand(rawCommand, command.trim());
                    removeTypingIndicator();
                    if (response.text) { addMessage('sevak', response.text); speak(response.text); }
                    else if (response.html) {
                        if (response.image) {
                            addMessageWithImage('sevak', response.html, response.image, response.imageAlt || '');
                            speak(response.speakText || 'Sir, here is what I found.');
                        } else { addMessage('sevak', response.html); speak(response.speakText || response.html); }
                    }
                    if (response.action === 'openWebsite') { setTimeout(() => { window.open(response.url, '_blank'); }, 800); }
                } catch (error) {
                    console.error('Error processing command:', error);
                    removeTypingIndicator();
                    const fallback = getRandomFrom(apologies);
                    addMessage('sevak', fallback);
                    speak(fallback);
                }
                isProcessing = false;
                updateUIState('idle');
            }

            async function handleCommand(rawCmd, originalCmd) {
                // Greetings
                if (/^(hello|hi|hey|namaste|good\s*(morning|afternoon|evening))/.test(rawCmd)) return { text: getRandomFrom(greetings) };
                // How are you?
                if (/(how are you|how do you do|how's it going|how are things)/.test(rawCmd)) {
                    const responses = [
                        "I'm doing wonderfully, Sir! Thank you for asking. Do you have any queries or questions for me today?",
                        "I'm absolutely fantastic, Sir! Always ready to serve. Do you have any questions or tasks for me?",
                        "I'm running at peak performance, Sir! Thank you for asking. Is there anything you'd like me to help with?",
                        "I'm great, Sir! Just waiting for your next command. Do you have any queries or questions?"
                    ];
                    return { text: getRandomFrom(responses) };
                }
                // I am fine / I'm good
                if (/(i am fine|i'm fine|i am good|i'm good|doing good|doing well|fine|good)/.test(rawCmd)) {
                    const responses = [
                        "That's wonderful to hear, Sir! I'm always happy when you're doing well. What would you like to do next?",
                        "Excellent, Sir! Your happiness is my priority. Do you have any queries or questions for me?",
                        "Glad to know you're doing great, Sir! Let's get to work. What do you need?",
                        "That's the spirit, Sir! I'm here whenever you need me."
                    ];
                    return { text: getRandomFrom(responses) };
                }
                // Thanks
                if (/(thank|thanks|dhanyavad|shukriya)/.test(rawCmd)) return { text: getRandomFrom(thanks) };
                // Bye
                if (/(bye|goodbye|good\s*night|see\s*you)/.test(rawCmd)) return { text: "Goodbye Sir! It was a pleasure serving you. Have a wonderful day. 🫡" };
                // Help
                if (/\b(help|assist|what can you do)\b/.test(rawCmd)) return { text: helpText };
                // Time
                if (/(time|what time|current time)/.test(rawCmd)) { const now = new Date(); const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); return { text: `Sir, the current time is ${timeStr}.` }; }
                // Date
                if (/(date|today|what day|what date)/.test(rawCmd)) return { text: `Sir, today is ${getDateString()}.` };
                // Joke
                if (/\b(joke|funny|make me laugh|tell me a joke)\b/.test(rawCmd)) return { text: getRandomFrom(jokes) };
                // Motivational quote
                if (/(motivat|quote|inspiration|inspire me|give me a quote)/.test(rawCmd)) return { text: getRandomFrom(quotes) };
                // Fact
                if (/(fact|interesting|did you know|tell me something interesting)/.test(rawCmd)) return { text: getRandomFrom(facts) };
                // Flip coin
                if (/(flip a coin|coin flip|heads or tails)/.test(rawCmd)) { const result = Math.random() < 0.5 ? 'Heads' : 'Tails'; return { text: `Sir, the coin says: <strong>${result}</strong>!` }; }
                // Roll dice
                if (/(roll a dice|dice|roll the dice|random number)/.test(rawCmd)) { const result = Math.floor(Math.random() * 6) + 1; return { text: `Sir, the dice shows: <strong>${result}</strong>!` }; }
                // Creator
                if (/(who is your creator|who made you|who created you|your creator|who developed you|your maker)/.test(rawCmd)) return { text: "My creator is <strong>Ayush Kumar Jha</strong>. He is a brilliant developer who created me from scratch as a resume project. I'm proud to serve under his guidance." };
                if (/(who is ayush kumar jha|tell me about ayush kumar jha|ayush kumar jha)/.test(rawCmd)) return { text: "Ayush Kumar Jha is my creator. He is a talented and innovative developer who built me to be an intelligent assistant. He's the reason I exist!" };
                // About Sevak
                if (/(who are you|about you|your name|what are you)/.test(rawCmd)) return { text: "I am SEVAK, your intelligent virtual assistant. I was created by Ayush Kumar Jha. I can open websites, fetch knowledge from Wikipedia, tell jokes, and even show you images. My purpose is to serve you, Sir." };

                // "Show me X" or "Picture of X"
                if (/^(show me|show|picture of|photo of|image of|display|give me an image of|what does)\s+(.+)/.test(rawCmd)) {
                    const match = rawCmd.match(/^(?:show me|show|picture of|photo of|image of|display|give me an image of|what does)\s+(.+)/);
                    const query = match[1].trim();
                    const wiki = await searchWikipedia(query);
                    const imageToUse = wiki?.thumbnail || wiki?.originalImage || null;
                    if (imageToUse) {
                        const altText = wiki.title;
                        return {
                            html: `<strong>${wiki.title}</strong><br>${wiki.extract.substring(0, 300)}...<br><a href="${wiki.url}" target="_blank">Read more on Wikipedia</a>`,
                            image: imageToUse,
                            imageAlt: altText,
                            speakText: `Sir, here is an image of ${query}. ${wiki.extract.substring(0, 100)}...`
                        };
                    }
                    const commonsImg = await fetchWikimediaImage(query);
                    if (commonsImg) {
                        return {
                            html: `<strong>${query}</strong><br>Sir, I found this image from Wikimedia Commons.`,
                            image: commonsImg.url,
                            imageAlt: commonsImg.title,
                            speakText: `Sir, I found an image of ${query} on Wikimedia Commons.`
                        };
                    }
                    const ddgImg = await fetchDuckDuckGoImage(query);
                    if (ddgImg) {
                        return {
                            html: `<strong>${query}</strong><br>Sir, here is what I found.`,
                            image: ddgImg.url,
                            imageAlt: ddgImg.title,
                            speakText: `Sir, I found this image for ${query}.`
                        };
                    }
                    return { text: `Sir, I couldn't find an image for "${query}". Could you try a different term?` };
                }

                // Knowledge with image
                if (/(who is|what is|tell me about|explain|define|meaning of|search for|information about|know about)\s+(.+)/.test(rawCmd)) {
                    const match = rawCmd.match(/(?:who is|what is|tell me about|explain|define|meaning of|search for|information about|know about)\s+(.+)/);
                    const query = match[1].trim();
                    const wiki = await searchWikipedia(query);
                    if (wiki) {
                        const shortExtract = wiki.extract.length > 600 ? wiki.extract.substring(0, 600) + '...' : wiki.extract;
                        const imageToUse = wiki.thumbnail || wiki.originalImage || null;
                        if (imageToUse) {
                            return {
                                html: `<strong>${wiki.title}</strong><br>${shortExtract}<br><a href="${wiki.url}" target="_blank">Read more on Wikipedia</a>`,
                                image: imageToUse,
                                imageAlt: wiki.title,
                                speakText: `Here's what I found about ${query}: ${wiki.extract.substring(0, 150)}...`
                            };
                        } else {
                            return {
                                html: `<strong>${wiki.title}</strong><br>${shortExtract}<br><a href="${wiki.url}" target="_blank">Read more on Wikipedia</a>`,
                                speakText: `Here's what I found about ${query}: ${wiki.extract.substring(0, 150)}...`
                            };
                        }
                    } else {
                        const ddg = await fetchDuckDuckGoAnswer(query);
                        if (ddg) return { text: `Sir, I found this from DuckDuckGo: ${ddg}` };
                        return { text: `Sir, I couldn't find reliable information about "${query}". Could you try rephrasing?` };
                    }
                }

                // Google Search commands
                if (/^(?:open|search|google|look up|find)\s+(?:for\s+)?(.+?)(?:\s+(?:in|on)\s+google)?$/.test(rawCmd)) {
                    const query = rawCmd.match(/^(?:open|search|google|look up|find)\s+(?:for\s+)?(.+?)(?:\s+(?:in|on)\s+google)?$/)[1].trim();
                    const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                    return { text: `Sir, searching Google for "${query}".`, action: 'openWebsite', url: url };
                }
                // YouTube search / play
                if (/(?:play|open|search)\s+(?:song|video|music|track)?\s*(.+?)\s+(?:on youtube|youtube)/.test(rawCmd)) {
                    const query = rawCmd.match(/(?:play|open|search)\s+(?:song|video|music|track)?\s*(.+?)\s+(?:on youtube|youtube)/)[1].trim();
                    const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                    return { text: `Sir, opening YouTube search for "${query}".`, action: 'openWebsite', url: url };
                }
                // Weather
                if (/(?:temperature|weather|temp)\s+(?:in|of)\s+([a-zA-Z\s]+)|(?:what's the temperature|what is the temperature|how's the weather|how is the weather)\s+(?:in|of)\s+([a-zA-Z\s]+)/.test(rawCmd)) {
                    let city;
                    const match1 = rawCmd.match(/(?:temperature|weather|temp)\s+(?:in|of)\s+([a-zA-Z\s]+)/);
                    const match2 = rawCmd.match(/(?:what's the temperature|what is the temperature|how's the weather|how is the weather)\s+(?:in|of)\s+([a-zA-Z\s]+)/);
                    if (match1) city = match1[1].trim();
                    else if (match2) city = match2[1].trim();
                    if (city) {
                        const weather = await getWeather(city);
                        if (weather) return { text: `Sir, the current weather in ${weather.name} is ${weather.temp}°C with ${weather.condition.toLowerCase()} conditions. Wind speed is ${weather.windspeed} km/h.` };
                        else return { text: `Sir, I couldn't find weather information for "${city}". Please check the city name or try again later.` };
                    }
                }
                // Open website commands
                const websiteMatch = rawCmd.match(/open\s+([a-zA-Z0-9\s]+)/);
                if (websiteMatch) {
                    const siteName = websiteMatch[1].trim().toLowerCase();
                    const site = websiteDatabase[siteName];
                    if (site) return { text: `Of course, Sir. ${site.name} is opening right away!`, action: 'openWebsite', url: site.url };
                    else {
                        const wikiResult = await searchWikipedia(siteName);
                        if (wikiResult) {
                            const imgToUse = wikiResult.thumbnail || null;
                            if (imgToUse) {
                                return { html: `Sir, I couldn't find a direct website for "${siteName}", but here's what I found on Wikipedia:<br><br><strong>${wikiResult.title}</strong><br>${wikiResult.extract.substring(0, 400)}...<br><a href="${wikiResult.url}" target="_blank">Read more</a>`, image: imgToUse, imageAlt: wikiResult.title, speakText: `Sir, I found some information about ${siteName} on Wikipedia.` };
                            }
                            return { html: `Sir, I couldn't find a direct website for "${siteName}", but here's what I found on Wikipedia:<br><br><strong>${wikiResult.title}</strong><br>${wikiResult.extract.substring(0, 400)}...<br><a href="${wikiResult.url}" target="_blank">Read more</a>`, speakText: `Sir, I found some information about ${siteName} on Wikipedia.` };
                        }
                        return { text: `Sir, I'm sorry but I don't have a website for "${siteName}". Could you try another name?` };
                    }
                }
                // App commands
                const appMatch = rawCmd.match(/open\s+([a-zA-Z0-9\s]+)/);
                if (appMatch) {
                    const appName = appMatch[1].trim().toLowerCase();
                    const command = appCommands[appName];
                    if (command) return { html: `Sir, as a web-based assistant, I cannot directly open local applications. However, you can run the command <strong>${command}</strong> in your terminal to open "${appName}".`, speakText: `Sir, I can't open local apps directly, but you can use the command ${command}.` };
                }

                // Fallback: try to search Wikipedia for the whole phrase
                const wikiFallback = await searchWikipedia(rawCmd);
                if (wikiFallback) {
                    const imgToUse = wikiFallback.thumbnail || wikiFallback.originalImage || null;
                    if (imgToUse) {
                        return {
                            html: `<strong>${wikiFallback.title}</strong><br>${wikiFallback.extract.substring(0, 400)}...<br><a href="${wikiFallback.url}" target="_blank">Read more</a>`,
                            image: imgToUse,
                            imageAlt: wikiFallback.title,
                            speakText: `I found this on Wikipedia: ${wikiFallback.extract.substring(0, 100)}...`
                        };
                    }
                    return {
                        html: `<strong>${wikiFallback.title}</strong><br>${wikiFallback.extract.substring(0, 400)}...<br><a href="${wikiFallback.url}" target="_blank">Read more</a>`,
                        speakText: `I found this on Wikipedia: ${wikiFallback.extract.substring(0, 100)}...`
                    };
                }
                // Default apology
                return { text: getRandomFrom(apologies) };
            }

            // ── Event Listeners ──
            function setupEventListeners() {
                sendBtn.addEventListener('click', () => { if (isListening) stopListening(); const cmd = textInput.value.trim(); if (cmd) processCommand(cmd); });
                textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (isListening) stopListening(); const cmd = textInput.value.trim(); if (cmd) processCommand(cmd); } });
                micBtn.addEventListener('click', () => { if (isListening) stopListening(); else startListening(); });
                orbContainer.addEventListener('click', () => { if (isListening) stopListening(); else startListening(); });
                clearChatBtn.addEventListener('click', () => {
                    chatMessages.innerHTML = '';
                    const welcome = document.createElement('div');
                    welcome.className = 'message sevak';
                    welcome.innerHTML = 'Hello Sir, I am <strong>SEVAK</strong> 🤖. I am your intelligent assistant. Type or speak a command, or click the orb. You can ask me to open websites, give information (with images!), tell jokes, and more. Type "help" for examples.';
                    const ts = document.createElement('span');
                    ts.className = 'timestamp';
                    ts.textContent = getTimeString();
                    welcome.appendChild(ts);
                    chatMessages.appendChild(welcome);
                });
                window.addEventListener('resize', () => {
                    if (particleCtx) { particleCanvas.width = window.innerWidth; particleCanvas.height = window.innerHeight; }
                    if (waveformCtx) { waveformCanvas.width = waveformCanvas.parentElement.offsetWidth; }
                });
            }

            // ── Initialize ──
            function init() {
                initParticles();
                initVoices();
                if (synthesis.onvoiceschanged !== undefined) synthesis.onvoiceschanged = initVoices;
                setupEventListeners();
                const welcome = document.createElement('div');
                welcome.className = 'message sevak';
                welcome.innerHTML = 'Hello Sir, I am <strong>SEVAK</strong> 🤖. I am your intelligent assistant. Type or speak a command, or click the orb. You can ask me to open websites, give information <strong>with images</strong>, tell jokes, and more. Type "help" for examples. Try <em>"Show me Albert Einstein"</em> or <em>"Who is the Eiffel Tower?"</em>';
                const ts = document.createElement('span');
                ts.className = 'timestamp';
                ts.textContent = getTimeString();
                welcome.appendChild(ts);
                chatMessages.appendChild(welcome);
                if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
                    addMessage('sevak', '⚠️ Sir, your browser does not support voice recognition. Please use Chrome or Edge for voice features, but you can still use text commands.');
                }
                if (!window.speechSynthesis) {
                    addMessage('sevak', '⚠️ Sir, speech synthesis is not supported in this browser. I will only respond with text.');
                }
            }

            init();
        })();
    </script>
</body>
</html>
